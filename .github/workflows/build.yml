name: "Build and Cache Outputs"
on: [push]
jobs:
  production-cache:
    if: ${{ github.repository == 'petm5/nix-config' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v31.10.1
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-platforms = aarch64-linux
          accept-flake-config = 1
    - name: Set up QEMU ARM64
      uses: docker/setup-qemu-action@v4.0.0
      with:
        platforms: arm64
    - name: Restore and save Nix Store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1G
    - name: Build desktop Nix config
      run: |
        nix build \
          .#nixosConfigurations.peter-pc.config.system.build.toplevel \
          --out-link result-nixos
    - name: Build nix-on-droid config
      run: |
        nix build \
          .#nixOnDroidConfigurations.a15.activationPackage \
          --out-link result-nod
    - name: Find which Nix paths are unique to the closure
      run: |
        ./scripts/unique-closure-paths.nu ./result* > unique-paths.txt
    - name: Sign Nix paths
      env:
        NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
      run: |
        trap 'rm -f cache-priv-key.pem' EXIT
        echo "$NIX_SIGNING_KEY" > cache-priv-key.pem
        chmod 600 cache-priv-key.pem

        nix store sign -k cache-priv-key.pem --stdin < unique-paths.txt
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.NIX_SSH_PRIVATE_KEY }}
    - name: Copy Nix paths to binary cache
      env:
        NIX_REMOTE_HOST: ${{ vars.NIX_REMOTE_HOST }}
      run: |
        nix copy --to "$NIX_REMOTE_HOST" --stdin < unique-paths.txt
