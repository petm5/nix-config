name: "Deploy to Binary Cache"
on: [push]
jobs:
  production-cache:
    if: ${{ github.repository == 'petm5/nix-config' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v31.11.2
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-platforms = aarch64-linux
          accept-flake-config = 1
    - name: Set up CI secrets
      env:
        NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
      run: |
        sudo mkdir -p -m 0600 /var/secrets
        sudo touch /var/secrets/nix-cache-priv-key
        sudo chmod 600 /var/secrets/nix-cache-priv-key
        printenv NIX_SIGNING_KEY | sudo tee /var/secrets/nix-cache-priv-key >/dev/null
        echo "secret-key-files = /var/secrets/nix-cache-priv-key" | sudo tee -a /etc/nix.conf
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.NIX_SSH_PRIVATE_KEY }}
    - name: Set up QEMU ARM64
      uses: docker/setup-qemu-action@v4.4.0
      with:
        platforms: arm64
    - name: Restore and save Nix Store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1G
    - name: Build packages marked for caching
      run: |
        nix build \
          .#packages.x86_64-linux.binary-cache-paths \
          --out-link result-cache-paths
    - name: Deploy binary cache to the remote server
      env:
        NIX_REMOTE_HOST: ${{ vars.NIX_REMOTE_HOST }}
      run: |
        mkdir cache-closure
        ./scripts/unique-closure-paths.nu result-cache-paths | xargs ln -s -t cache-closure
        nix-store --add cache-closure | nix copy --to "$NIX_REMOTE_HOST" --stdin
